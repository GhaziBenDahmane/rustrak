name: Docker Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  # id-token: write is required for npm provenance attestation. The Pages
  # permissions that used to live here moved to deploy-docs.yml along with the
  # job that needed them.
  id-token: write

jobs:
  # The published artifacts (server, dashboard, client, mcp) are a `fixed` group
  # in .changeset/config.json: one version, one tag, one release, everything
  # ships together. So there is nothing to detect, we only need the version off
  # the tag. `docs` is outside the group, versioned on its own and deployed by
  # deploy-docs.yml, which listens for the same `release: published` event.
  #
  # The dashboard has no image of its own any more: it is compiled into the
  # server's, which is why `rustrak/rustrak-ui` is no longer published here.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      # `channel` is which moving tags this build takes. A stable `vX.Y.Z`
      # moves `latest` (and `postgres`) and lands on npm's `latest` dist-tag.
      # A prerelease `vX.Y.Z-rc.N`, cut by release.yml from the `next` branch,
      # moves `next` (and `next-postgres`) and publishes under npm's `next`
      # dist-tag, so nobody pulling `latest` or running
      # `npm install @rustrak/client` picks up a release candidate by accident.
      - name: Extract version from release tag
        id: check
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"

          VERSION=$(echo "$TAG" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | sed 's/^v//')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not extract semver version from tag '$TAG'. Expected format: vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

          # A hyphen is semver's prerelease marker. The release's own flag
          # would say the same, but the tag is what release.yml decided from.
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL=next
          else
            CHANNEL=latest
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Version $VERSION on channel $CHANNEL"

  # ── SQLite image (default: latest) ───────────────────────────────────────────
  # Build on native runners (no QEMU). Each platform pushes by digest only.

  docker-server-sqlite-build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      # The image serves `apps/server/static` at `/`, and that directory is
      # written by `scripts/bundle-dashboard.sh`, which only the JavaScript
      # build runs. Without these steps the published image would be API-only:
      # correct, silent, and the worst kind of missing UI.
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "latest"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the dashboard into the server's build context
        run: |
          pnpm --filter @rustrak/dashboard build
          bash scripts/bundle-dashboard.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest (SQLite)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/server
          platforms: ${{ matrix.platform }}
          build-args: FEATURES=sqlite
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: rustrak/rustrak-server
          cache-from: type=gha,scope=server-sqlite-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=server-sqlite-${{ matrix.runner }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-server-sqlite-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-server-sqlite-manifest:
    needs: [version, docker-server-sqlite-build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-server-sqlite-*
          merge-multiple: true

      - name: Create manifest list and push (SQLite)
        working-directory: ${{ runner.temp }}/digests
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CHANNEL="${{ needs.version.outputs.channel }}"
          docker buildx imagetools create \
            -t rustrak/rustrak-server:v${VERSION} \
            -t rustrak/rustrak-server:${CHANNEL} \
            $(printf 'rustrak/rustrak-server@sha256:%s ' *)

      - name: Inspect image
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker buildx imagetools inspect rustrak/rustrak-server:v${VERSION}

  # ── PostgreSQL image ──────────────────────────────────────────────────────────

  docker-server-postgres-build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      # The image serves `apps/server/static` at `/`, and that directory is
      # written by `scripts/bundle-dashboard.sh`, which only the JavaScript
      # build runs. Without these steps the published image would be API-only:
      # correct, silent, and the worst kind of missing UI.
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "latest"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the dashboard into the server's build context
        run: |
          pnpm --filter @rustrak/dashboard build
          bash scripts/bundle-dashboard.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest (PostgreSQL)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/server
          platforms: ${{ matrix.platform }}
          build-args: FEATURES=postgres
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: rustrak/rustrak-server
          cache-from: type=gha,scope=server-postgres-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=server-postgres-${{ matrix.runner }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-server-postgres-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-server-postgres-manifest:
    needs: [version, docker-server-postgres-build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-server-postgres-*
          merge-multiple: true

      - name: Create manifest list and push (PostgreSQL)
        working-directory: ${{ runner.temp }}/digests
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CHANNEL="${{ needs.version.outputs.channel }}"
          # The stable moving tag is `postgres`, not `latest-postgres`.
          if [[ "$CHANNEL" == "latest" ]]; then
            MOVING=postgres
          else
            MOVING="${CHANNEL}-postgres"
          fi
          docker buildx imagetools create \
            -t rustrak/rustrak-server:v${VERSION}-postgres \
            -t rustrak/rustrak-server:${MOVING} \
            $(printf 'rustrak/rustrak-server@sha256:%s ' *)

      - name: Inspect image
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker buildx imagetools inspect rustrak/rustrak-server:v${VERSION}-postgres

  # ── npm publish ───────────────────────────────────────────────────────────────

  publish-npm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "latest"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # mcp depends on client, so client must build first.
      - name: Build packages
        run: pnpm --filter @rustrak/client build && pnpm --filter @rustrak/mcp build

      # `--tag` is the dist-tag. Without it npm points `latest` at whatever was
      # published last, prerelease included, and `npm install @rustrak/client`
      # would hand out a release candidate.
      - name: Publish @rustrak/client
        run: pnpm --filter @rustrak/client publish --no-git-checks --access public --tag "${{ needs.version.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @rustrak/mcp
        run: pnpm --filter @rustrak/mcp publish --no-git-checks --access public --tag "${{ needs.version.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
