services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One service, and one image: the dashboard is compiled into static files
  # that this same process hands out at `/`, so there is no second container
  # and no second origin. It is still optional — an image built without the
  # dashboard serves the API and nothing else.
  server:
    image: rustrak/rustrak-server:latest
    # Behind a reverse proxy on the same Docker network, delete this `ports`
    # block: the proxy reaches the container on 8080 and nothing needs a host
    # port. Full setup: https://rustrak.github.io/rustrak/configuration/production#reverse-proxy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - RUST_LOG=${RUST_LOG}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - CREATE_SUPERUSER=${CREATE_SUPERUSER}
      # The host your SDKs will send events to, e.g. https://rustrak.example.com.
      # Without it the DSN carries the bind address, which nothing can reach.
      - PUBLIC_URL=${PUBLIC_URL:-}
      - SOURCEMAP_STORAGE_PATH=/data/sourcemaps
    volumes:
      - sourcemap_data:/data/sourcemaps
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  sourcemap_data:
